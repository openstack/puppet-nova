---
security:
  - |
    The cephx key managed by the ``nova::compute::libvirt::secret_ceph``
    resource is now always handled as a ``Sensitive`` value, so that it is
    redacted in puppet logs, reports and the catalog. This applies to the
    ``value`` parameter of ``nova::compute::libvirt::secret_ceph`` and the
    ``libvirt_rbd_secret_key`` parameter of ``nova::compute::rbd``. Wrap the
    value passed to these parameters in ``Sensitive`` to also redact the
    parameter itself in the catalog.
features:
  - |
    The ``value`` parameter of the ``nova::compute::libvirt::secret_ceph``
    resource and the ``libvirt_rbd_secret_key`` parameter of the
    ``nova::compute::rbd`` class now accept values wrapped in ``Sensitive``.
